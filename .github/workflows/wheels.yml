name: Wheels

# Heavy cross-platform wheel build. Reserved for releases (and manual runs) so
# PRs stay fast: see ci.yml for per-PR test + sanity-build feedback.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:  # build wheels on demand without cutting a release

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest   # manylinux + musllinux x86_64
          - macos-15        # Apple Silicon arm64 (macos-13 Intel retired Dec 2025;
                            # macos-14 is also arm64 so building on both is redundant)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # vendored zlib-ng + zstd must be present

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        # All build config (skips, before-all, test-command, macOS target)
        # lives in [tool.cibuildwheel] in pyproject.toml.

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # so the sdist vendors zlib-ng + zstd

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # Publish to PyPI on a published GitHub release via Trusted Publishing (OIDC).
  # Configure a PyPI trusted publisher for this repo + workflow, and a GitHub
  # environment named `pypi`. No API token secret required.
  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true  # flatten wheels-* and sdist into dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
